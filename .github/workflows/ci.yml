name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: web
          node-version: "24"
          cache: true

      - name: Check frontend (format, lint, types)
        working-directory: web
        run: vp check

      - name: Test frontend
        working-directory: web
        run: vp test

      - name: Build frontend
        working-directory: web
        run: vp build

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install E2E browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Test application E2E
        working-directory: web
        run: pnpm run test:e2e

      - name: Vet
        run: go vet ./...

      - name: Test backend
        run: go test -race ./...
